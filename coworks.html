<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Coworks - リサーチ → PowerPoint</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0d0d1a;
  color: #eee;
  font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
}

h1 {
  font-size: 2rem;
  color: #4a9eff;
  margin-bottom: 6px;
  letter-spacing: 0.05em;
}

.subtitle {
  color: #8888aa;
  font-size: 0.95rem;
  margin-bottom: 40px;
}

.card {
  background: #1a1a2e;
  border: 1px solid #2a2a4a;
  border-radius: 12px;
  padding: 32px;
  width: 100%;
  max-width: 680px;
}

label {
  display: block;
  font-size: 0.85rem;
  color: #8888aa;
  margin-bottom: 8px;
  letter-spacing: 0.04em;
}

input[type="text"] {
  width: 100%;
  background: #0d0d1a;
  border: 1px solid #3a3a5a;
  border-radius: 8px;
  color: #eee;
  font-size: 1rem;
  padding: 12px 16px;
  outline: none;
  transition: border-color 0.2s;
}
input[type="text"]:focus { border-color: #4a9eff; }

button#generate-btn {
  margin-top: 20px;
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #4a9eff, #7a5fff);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
}
button#generate-btn:hover { opacity: 0.9; }
button#generate-btn:active { transform: scale(0.99); }
button#generate-btn:disabled { opacity: 0.5; cursor: default; }

/* Progress */
#progress {
  display: none;
  margin-top: 28px;
}

.step-list { list-style: none; }
.step {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid #1f1f35;
  font-size: 0.95rem;
  color: #8888aa;
  transition: color 0.3s;
}
.step:last-child { border-bottom: none; }
.step.active { color: #4a9eff; }
.step.done { color: #44cc88; }

.icon {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  flex-shrink: 0;
  background: #2a2a4a;
  color: #8888aa;
  transition: background 0.3s, color 0.3s;
}
.step.active .icon {
  background: #1a3a6a;
  color: #4a9eff;
  animation: pulse 1s infinite;
}
.step.done .icon {
  background: #1a4a35;
  color: #44cc88;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* Result */
#result {
  display: none;
  margin-top: 28px;
  text-align: center;
}

#result .success-msg {
  color: #44cc88;
  font-size: 1.05rem;
  margin-bottom: 14px;
}

#result a {
  display: inline-block;
  padding: 12px 28px;
  background: #44cc88;
  color: #0d1a12;
  border-radius: 8px;
  font-weight: 700;
  text-decoration: none;
  transition: opacity 0.2s;
}
#result a:hover { opacity: 0.85; }

/* Error */
#error-msg {
  display: none;
  margin-top: 20px;
  padding: 12px 16px;
  background: #2a1a1a;
  border: 1px solid #aa3333;
  border-radius: 8px;
  color: #ff6666;
  font-size: 0.9rem;
}

/* Agent badges */
.agents {
  display: flex;
  gap: 10px;
  margin-bottom: 28px;
  flex-wrap: wrap;
  justify-content: center;
}
.agent-badge {
  background: #1a1a2e;
  border: 1px solid #2a2a4a;
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 0.78rem;
  color: #8888aa;
  display: flex;
  align-items: center;
  gap: 6px;
}
.agent-badge .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #4a9eff;
}
</style>
</head>
<body>

<h1>Claude Coworks</h1>
<p class="subtitle">トピックを入力するだけで、3つのAIエージェントがPowerPointを自動生成します</p>

<div class="agents">
  <div class="agent-badge"><span class="dot"></span>リサーチエージェント</div>
  <div class="agent-badge"><span class="dot" style="background:#7a5fff"></span>構成エージェント</div>
  <div class="agent-badge"><span class="dot" style="background:#44cc88"></span>PPTX生成エージェント</div>
</div>

<div class="card">
  <label for="topic-input">リサーチしたいトピック</label>
  <input type="text" id="topic-input" placeholder="例: 生成AIの最新トレンド、宇宙開発の現状、再生可能エネルギー…" />

  <button id="generate-btn" onclick="generate()">PowerPoint を生成する</button>

  <div id="error-msg"></div>

  <div id="progress">
    <ul class="step-list">
      <li class="step" id="step-1">
        <div class="icon">1</div>
        <span>リサーチエージェントが情報を収集・要約中…</span>
      </li>
      <li class="step" id="step-2">
        <div class="icon">2</div>
        <span>構成エージェントがスライド構成を設計中…</span>
      </li>
      <li class="step" id="step-3">
        <div class="icon">3</div>
        <span>PPTXエージェントがファイルを生成中…</span>
      </li>
    </ul>
  </div>

  <div id="result">
    <p class="success-msg">✓ PowerPoint が完成しました！</p>
    <a id="download-link" href="#" download>ダウンロード</a>
  </div>
</div>

<script>
const SERVER = "http://localhost:5000";

function setStep(n) {
  [1, 2, 3].forEach(i => {
    const el = document.getElementById(`step-${i}`);
    el.classList.remove("active", "done");
    if (i < n) el.classList.add("done");
    if (i === n) el.classList.add("active");
  });
}

async function generate() {
  const topic = document.getElementById("topic-input").value.trim();
  if (!topic) {
    showError("トピックを入力してください。");
    return;
  }

  const btn = document.getElementById("generate-btn");
  btn.disabled = true;
  document.getElementById("error-msg").style.display = "none";
  document.getElementById("result").style.display = "none";
  document.getElementById("progress").style.display = "block";

  setStep(1);

  // We drive progress visually while the single API call runs all 3 agents
  // Step timings are approximate — the server streams nothing, so we simulate.
  const stepTimer1 = setTimeout(() => setStep(2), 8000);
  const stepTimer2 = setTimeout(() => setStep(3), 16000);

  try {
    const res = await fetch(`${SERVER}/generate`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic }),
    });

    clearTimeout(stepTimer1);
    clearTimeout(stepTimer2);

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || "サーバーエラーが発生しました。");
    }

    setStep(4); // all done
    [1, 2, 3].forEach(i =>
      document.getElementById(`step-${i}`).classList.add("done")
    );

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const link = document.getElementById("download-link");
    link.href = url;
    link.download = `${topic.slice(0, 30)}.pptx`;

    document.getElementById("result").style.display = "block";
  } catch (e) {
    clearTimeout(stepTimer1);
    clearTimeout(stepTimer2);
    showError(e.message);
  } finally {
    btn.disabled = false;
  }
}

function showError(msg) {
  const el = document.getElementById("error-msg");
  el.textContent = "エラー: " + msg;
  el.style.display = "block";
  document.getElementById("progress").style.display = "none";
}

// Allow Enter key
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("topic-input").addEventListener("keydown", e => {
    if (e.key === "Enter") generate();
  });
});
</script>
</body>
</html>
