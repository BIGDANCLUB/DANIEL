<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逆転裁判風 - 法廷バトル</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a0a0a;
  color: #fff;
  font-family: 'MS Gothic', 'Hiragino Kaku Gothic Pro', monospace;
  overflow: hidden;
  user-select: none;
}

#game-container {
  width: 100vw; height: 100vh;
  position: relative;
  overflow: hidden;
}

/* Title Screen */
#title-screen {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(180deg, #0a0a2a 0%, #1a0a0a 50%, #0a0a2a 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 200;
}
#title-screen h1 {
  font-size: 52px; color: #ff4444;
  text-shadow: 0 0 30px rgba(255,50,50,0.6), 2px 2px 0 #000;
  letter-spacing: 12px; margin-bottom: 8px;
}
#title-screen .subtitle {
  font-size: 20px; color: #ffcc00; margin-bottom: 50px; letter-spacing: 4px;
}
#title-screen button {
  font-size: 22px; padding: 14px 50px; margin: 8px;
  background: #2a1a1a; border: 2px solid #ff4444; color: #ff4444;
  cursor: pointer; font-family: inherit; letter-spacing: 4px;
  transition: all 0.2s;
}
#title-screen button:hover { background: #3a2a2a; box-shadow: 0 0 15px rgba(255,50,50,0.4); }

/* Courtroom Scene */
#courtroom {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: none;
}

/* Background */
#court-bg {
  width: 100%; height: 55%;
  background: linear-gradient(180deg, #2a1a0a 0%, #3a2a1a 60%, #4a3a2a 100%);
  position: relative;
  border-bottom: 4px solid #5a4a3a;
}

/* Character Display */
#character-area {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 300px; height: 350px;
  display: flex; align-items: flex-end; justify-content: center;
}
#character-sprite {
  font-size: 180px; line-height: 1;
  filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.8));
  transition: transform 0.1s;
}
#character-name-plate {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.8); border: 1px solid #888;
  padding: 3px 15px; font-size: 14px; white-space: nowrap;
  border-radius: 2px;
}

/* Witness stand */
#witness-stand {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 200px; height: 80px;
  background: linear-gradient(180deg, #6a5a3a, #4a3a2a);
  border-top: 3px solid #8a7a5a;
  border-radius: 5px 5px 0 0;
}

/* Desk for attorney */
#attorney-desk {
  position: absolute; bottom: 0; right: 30px;
  width: 180px; height: 60px;
  background: linear-gradient(180deg, #5a4a2a, #3a2a1a);
  border-top: 3px solid #7a6a4a;
  border-radius: 5px 5px 0 0;
}
#prosecutor-desk {
  position: absolute; bottom: 0; left: 30px;
  width: 180px; height: 60px;
  background: linear-gradient(180deg, #5a4a2a, #3a2a1a);
  border-top: 3px solid #7a6a4a;
  border-radius: 5px 5px 0 0;
}

/* Text Box */
#text-box {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 45%;
  background: linear-gradient(180deg, #1a1a2a, #0a0a1a);
  border-top: 3px solid #4a4a6a;
  padding: 0;
}
#speaker-name {
  background: #aa2222; color: #fff; display: inline-block;
  padding: 5px 20px; font-size: 16px; font-weight: bold;
  margin: 10px 0 0 20px; border-radius: 3px;
  min-width: 100px; text-align: center;
}
#dialogue-text {
  padding: 12px 25px; font-size: 18px; line-height: 1.8;
  min-height: 80px; letter-spacing: 1px;
}
#dialogue-text .highlight { color: #ff4444; font-weight: bold; }

/* Statement Counter */
#statement-counter {
  position: absolute; top: 15px; right: 20px;
  background: rgba(0,0,0,0.7); border: 1px solid #666;
  padding: 5px 12px; font-size: 13px; border-radius: 3px;
}

/* Action Buttons */
#action-buttons {
  position: absolute; bottom: 15px; right: 20px;
  display: flex; gap: 8px;
}
#action-buttons button {
  padding: 8px 18px; font-size: 14px; cursor: pointer;
  font-family: inherit; border-radius: 4px; transition: all 0.2s;
  border: 2px solid; letter-spacing: 2px;
}
.btn-next {
  background: #1a2a3a; border-color: #4488cc !important; color: #88bbee;
}
.btn-next:hover { background: #2a3a4a; }
.btn-press {
  background: #2a2a1a; border-color: #ccaa44 !important; color: #ffdd66;
}
.btn-press:hover { background: #3a3a2a; }
.btn-present {
  background: #3a1a1a; border-color: #cc4444 !important; color: #ff6666;
}
.btn-present:hover { background: #4a2a2a; box-shadow: 0 0 10px rgba(255,50,50,0.3); }

/* Evidence Panel */
#evidence-panel {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.92); z-index: 100; display: none;
  flex-direction: column;
}
#evidence-header {
  background: #2a1a1a; padding: 12px 20px;
  border-bottom: 2px solid #aa4444;
  display: flex; justify-content: space-between; align-items: center;
}
#evidence-header h2 { color: #ff6666; font-size: 20px; letter-spacing: 4px; }
#evidence-list {
  flex: 1; overflow-y: auto; padding: 10px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 10px; align-content: start;
}
.evidence-card {
  background: #1a1a2a; border: 2px solid #3a3a5a;
  padding: 12px; cursor: pointer; border-radius: 4px;
  transition: all 0.2s;
}
.evidence-card:hover {
  border-color: #ff6666; background: #2a1a2a;
  box-shadow: 0 0 10px rgba(255,50,50,0.2);
}
.evidence-card.selected {
  border-color: #ff4444; background: #3a1a1a;
  box-shadow: 0 0 15px rgba(255,50,50,0.4);
}
.evidence-card h4 { color: #ffcc44; font-size: 14px; margin-bottom: 5px; }
.evidence-card p { color: #aaa; font-size: 12px; line-height: 1.5; }
.evidence-card .evidence-icon { font-size: 28px; float: left; margin-right: 10px; }

#evidence-detail {
  background: #0a0a1a; border-top: 2px solid #3a3a5a;
  padding: 15px 20px; min-height: 100px;
}
#evidence-detail h3 { color: #ffcc44; margin-bottom: 5px; }
#evidence-detail p { color: #ccc; font-size: 14px; line-height: 1.6; }

#evidence-actions {
  background: #1a1a2a; padding: 10px 20px;
  border-top: 1px solid #333;
  display: flex; justify-content: flex-end; gap: 10px;
}
#evidence-actions button {
  padding: 8px 20px; font-size: 14px; cursor: pointer;
  font-family: inherit; border-radius: 4px;
}

/* Objection / Hold It / Take That overlays */
#shout-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 150; display: none;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0.3);
}
#shout-text {
  font-size: 72px; font-weight: bold; letter-spacing: 8px;
  text-shadow: 4px 4px 0 #000, 0 0 30px currentColor;
  animation: shoutAnim 0.5s ease-out;
}
@keyframes shoutAnim {
  0% { transform: scale(3) rotate(-5deg); opacity: 0; }
  50% { transform: scale(1.1) rotate(1deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

/* Screen flash */
#flash-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 140; display: none; background: #fff;
  animation: flashAnim 0.3s ease-out forwards;
}
@keyframes flashAnim {
  0% { opacity: 1; }
  100% { opacity: 0; }
}

/* Health / Penalty Bar */
#penalty-bar {
  position: absolute; top: 15px; left: 20px;
  display: flex; align-items: center; gap: 8px;
}
#penalty-label { font-size: 13px; color: #aaa; }
#penalty-gauge {
  width: 200px; height: 16px; background: #333;
  border: 1px solid #666; border-radius: 2px; overflow: hidden;
}
#penalty-fill {
  height: 100%; background: linear-gradient(90deg, #44cc44, #88ee44);
  transition: width 0.5s;
}

/* Shake animation */
.screen-shake {
  animation: shake 0.4s ease-in-out;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  10% { transform: translateX(-8px) rotate(-0.5deg); }
  30% { transform: translateX(8px) rotate(0.5deg); }
  50% { transform: translateX(-6px); }
  70% { transform: translateX(6px); }
  90% { transform: translateX(-3px); }
}

/* Result Screen */
#result-screen {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 200; display: none;
  flex-direction: column; align-items: center; justify-content: center;
}
#result-screen.victory { background: linear-gradient(180deg, #0a1a0a, #1a2a1a, #0a1a0a); }
#result-screen.defeat { background: linear-gradient(180deg, #1a0a0a, #2a1a1a, #1a0a0a); }
#result-screen h1 { font-size: 56px; margin-bottom: 20px; letter-spacing: 8px; }
#result-screen p { font-size: 18px; color: #aaa; margin-bottom: 30px; }
#result-screen button {
  font-size: 18px; padding: 12px 40px;
  background: #2a2a2a; border: 2px solid #888; color: #eee;
  cursor: pointer; font-family: inherit;
}
</style>
</head>
<body>

<div id="game-container">
  <!-- Title Screen -->
  <div id="title-screen">
    <h1>逆転法廷</h1>
    <div class="subtitle">〜 最後の証拠 〜</div>
    <button onclick="startGame()">はじめる</button>
  </div>

  <!-- Courtroom -->
  <div id="courtroom">
    <div id="court-bg">
      <div id="prosecutor-desk"></div>
      <div id="witness-stand"></div>
      <div id="attorney-desk"></div>
      <div id="character-area">
        <div id="character-sprite"></div>
      </div>
    </div>
    <div id="text-box">
      <div id="speaker-name">???</div>
      <div id="dialogue-text"></div>
      <div id="action-buttons"></div>
    </div>
    <div id="penalty-bar">
      <div id="penalty-label">ペナルティ</div>
      <div id="penalty-gauge"><div id="penalty-fill" style="width:100%"></div></div>
    </div>
    <div id="statement-counter"></div>
  </div>

  <!-- Evidence Panel -->
  <div id="evidence-panel">
    <div id="evidence-header">
      <h2>証 拠 品</h2>
      <button onclick="closeEvidence()" style="background:#3a2a2a;border:1px solid #aa4444;color:#ff8888;padding:6px 16px;cursor:pointer;font-family:inherit;">閉じる</button>
    </div>
    <div id="evidence-list"></div>
    <div id="evidence-detail">
      <h3>証拠品を選択してください</h3>
      <p>左の証拠品をクリックすると詳細が表示されます。</p>
    </div>
    <div id="evidence-actions">
      <button onclick="closeEvidence()" style="background:#2a2a3a;border:1px solid #666;color:#aaa;cursor:pointer;font-family:inherit;">戻る</button>
      <button id="btn-submit-evidence" onclick="submitEvidence()" style="background:#3a1a1a;border:2px solid #cc4444;color:#ff6666;cursor:pointer;font-family:inherit;display:none;">この証拠を突きつける！</button>
    </div>
  </div>

  <!-- Shout Overlay -->
  <div id="shout-overlay"><div id="shout-text"></div></div>
  <div id="flash-overlay"></div>

  <!-- Result Screen -->
  <div id="result-screen">
    <h1 id="result-title"></h1>
    <p id="result-message"></p>
    <button onclick="location.reload()">タイトルに戻る</button>
  </div>
</div>

    correctEvidence: 7,
    contradictionExplanation: '通話記録から行動の矛盾が証明できる',
    revealText: 'あなたは午後11時15分に自宅にいたと主張していますね。しかし通話記録では午後11時まで被害者と電話していた。そして被害者のマンションからあなたの自宅まで徒歩5分の距離です。電話の内容が「不正経理の追及」だったとしたら…あなたには動機も、時間的猶予も、十分にあったということです！',
  },
];

// Total contradictions to find
const TOTAL_CONTRADICTIONS = WITNESS_STATEMENTS.filter(s => s.contradiction !== null).length;

// ============================================================
// Game State
// ============================================================
let state = {
  phase: 'title', // title, testimony, pressing, presenting, result
  currentStatement: 0,
  foundContradictions: 0,
  penaltyHP: 100, // 0 = game over
  selectedEvidence: null,
  isPressing: false,
  revealedContradictions: new Set(),
  textQueue: [],
  textIndex: 0,
  isTyping: false,
  currentText: '',
  dialogueCallback: null,
  shakeTimeout: null,
};

// ============================================================
// Text Typing Effect
// ============================================================
function typeText(speaker, text, callback, speakerColor = '#aa2222') {
  const nameEl = document.getElementById('speaker-name');
  const textEl = document.getElementById('dialogue-text');

  nameEl.textContent = speaker;
  nameEl.style.background = speakerColor;
  textEl.innerHTML = '';
  state.isTyping = true;
  state.currentText = text;
  state.textIndex = 0;
  state.dialogueCallback = callback;

  function typeNext() {
    if (state.textIndex < text.length) {
      // Handle HTML tags
      if (text[state.textIndex] === '<') {
        const closeIdx = text.indexOf('>', state.textIndex);
        if (closeIdx !== -1) {
          state.textIndex = closeIdx + 1;
        }
      }
      textEl.innerHTML = text.substring(0, state.textIndex + 1);
      state.textIndex++;
      setTimeout(typeNext, 30);
    } else {
      state.isTyping = false;
    }
  }
  typeNext();
}

function skipOrAdvance() {
  if (state.isTyping) {
    // Skip to end
    const textEl = document.getElementById('dialogue-text');
    textEl.innerHTML = state.currentText;
    state.isTyping = false;
    state.textIndex = state.currentText.length;
  } else if (state.dialogueCallback) {
    const cb = state.dialogueCallback;
    state.dialogueCallback = null;
    cb();
  }
}

// ============================================================
// Shout Effects
// ============================================================
function showShout(text, color, callback) {
  const overlay = document.getElementById('shout-overlay');
  const textEl = document.getElementById('shout-text');
  const flash = document.getElementById('flash-overlay');

  // Flash
  flash.style.display = 'block';
  setTimeout(() => { flash.style.display = 'none'; }, 300);

  textEl.textContent = text;
  textEl.style.color = color;
  overlay.style.display = 'flex';

  // Remove and re-add for animation restart
  textEl.style.animation = 'none';
  void textEl.offsetHeight;
  textEl.style.animation = 'shoutAnim 0.5s ease-out';

  setTimeout(() => {
    overlay.style.display = 'none';
    if (callback) callback();
  }, 1200);
}

function shakeScreen() {
  const container = document.getElementById('courtroom');
  container.classList.add('screen-shake');
  clearTimeout(state.shakeTimeout);
  state.shakeTimeout = setTimeout(() => {
    container.classList.remove('screen-shake');
  }, 400);
}

// ============================================================
// Character Display
// ============================================================
function showCharacter(type) {
  const sprite = document.getElementById('character-sprite');
  switch(type) {
    case 'witness-normal':
      sprite.textContent = '👩‍💼';
      break;
    case 'witness-nervous':
      sprite.textContent = '😰';
      break;
    case 'witness-angry':
      sprite.textContent = '😠';
      break;
    case 'witness-shocked':
      sprite.textContent = '😱';
      break;
    case 'attorney':
      sprite.textContent = '👨‍⚖️';
      break;
    case 'prosecutor':
      sprite.textContent = '👨‍💼';
      break;
    case 'judge':
      sprite.textContent = '👴';
      break;
    default:
      sprite.textContent = '';
  }
}

// ============================================================
// Game Flow
// ============================================================
function startGame() {
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('courtroom').style.display = 'block';
  state.phase = 'testimony';

  showCharacter('judge');
  typeText('裁判長', 'それでは、証人・佐藤花子の証言を開始します。弁護人は証言に矛盾があれば、証拠を突きつけてください。', () => {
    showCharacter('witness-normal');
    typeText('佐藤花子', 'はい、証言いたします。', () => {
      showStatement(0);
    }, '#884422');
  }, '#444488');
}

function showStatement(index) {
  if (index >= WITNESS_STATEMENTS.length) {
    // All statements heard
    endTestimony();
    return;
  }

  state.currentStatement = index;
  state.isPressing = false;
  const stmt = WITNESS_STATEMENTS[index];

  document.getElementById('statement-counter').textContent =
    `証言 ${index + 1} / ${WITNESS_STATEMENTS.length}　|　矛盾発見: ${state.foundContradictions} / ${TOTAL_CONTRADICTIONS}`;

  showCharacter('witness-normal');
  typeText(stmt.speaker, stmt.text, () => {
    showStatementActions();
  }, '#884422');
}

function showStatementActions() {
  const btns = document.getElementById('action-buttons');
  const stmt = WITNESS_STATEMENTS[state.currentStatement];
  const alreadyRevealed = state.revealedContradictions.has(state.currentStatement);

  let html = '';
  html += `<button class="btn-next" onclick="nextStatement()">次へ ▶</button>`;
  html += `<button class="btn-press" onclick="pressWitness()">ゆさぶる</button>`;
  if (!alreadyRevealed) {
    html += `<button class="btn-present" onclick="openEvidenceToPresent()">証拠を突きつける</button>`;
  } else {
    html += `<button class="btn-present" style="opacity:0.3;cursor:default;" disabled>矛盾解明済み ✓</button>`;
  }
  btns.innerHTML = html;
}

function nextStatement() {
  document.getElementById('action-buttons').innerHTML = '';
  showStatement(state.currentStatement + 1);
}

function pressWitness() {
  const stmt = WITNESS_STATEMENTS[state.currentStatement];
  document.getElementById('action-buttons').innerHTML = '';

  showShout('ゆさぶる！', '#ffcc00', () => {
    showCharacter('witness-nervous');
    typeText(stmt.speaker, stmt.pressText, () => {
      showStatementActions();
    }, '#884422');
  });
}

// ============================================================
// Evidence Presentation
// ============================================================
function openEvidenceToPresent() {
  state.selectedEvidence = null;
  const panel = document.getElementById('evidence-panel');
  const list = document.getElementById('evidence-list');
  const submitBtn = document.getElementById('btn-submit-evidence');

  let html = '';
  for (const ev of EVIDENCE) {
    html += `<div class="evidence-card" id="ev-card-${ev.id}" onclick="selectEvidence(${ev.id})">`;
    html += `<span class="evidence-icon">${ev.icon}</span>`;
    html += `<h4>${ev.name}</h4>`;
    html += `<p>${ev.desc}</p>`;
    html += `</div>`;
  }
  list.innerHTML = html;

  document.getElementById('evidence-detail').innerHTML = '<h3>証拠品を選択してください</h3><p>突きつけたい証拠品をクリックしてください。</p>';
  submitBtn.style.display = 'none';
  panel.style.display = 'flex';
}

function selectEvidence(id) {
  state.selectedEvidence = id;
  const ev = EVIDENCE[id];

  // Highlight selected
  document.querySelectorAll('.evidence-card').forEach(c => c.classList.remove('selected'));
  document.getElementById(`ev-card-${id}`).classList.add('selected');

  // Show detail
  document.getElementById('evidence-detail').innerHTML =
    `<h3>${ev.icon} ${ev.name}</h3><p>${ev.detail}</p>`;

  document.getElementById('btn-submit-evidence').style.display = 'inline-block';
}

function closeEvidence() {
  document.getElementById('evidence-panel').style.display = 'none';
}

function submitEvidence() {
  if (state.selectedEvidence === null) return;
  closeEvidence();

  const stmt = WITNESS_STATEMENTS[state.currentStatement];
  const ev = EVIDENCE[state.selectedEvidence];

  if (stmt.correctEvidence === state.selectedEvidence) {
    // Correct!
    correctPresentation(stmt, ev);
  } else {
    // Wrong!
    wrongPresentation(ev);
  }
}

function correctPresentation(stmt, ev) {
  showShout('異議あり！', '#ff4444', () => {
    shakeScreen();
    showCharacter('attorney');
    typeText('弁護人', stmt.revealText, () => {
      showCharacter('witness-shocked');
      state.foundContradictions++;
      state.revealedContradictions.add(state.currentStatement);

      document.getElementById('statement-counter').textContent =
        `証言 ${state.currentStatement + 1} / ${WITNESS_STATEMENTS.length}　|　矛盾発見: ${state.foundContradictions} / ${TOTAL_CONTRADICTIONS}`;

      setTimeout(() => {
        typeText('佐藤花子', 'そ…それは……！', () => {
          // Check if all contradictions found
          if (state.foundContradictions >= TOTAL_CONTRADICTIONS) {
            allContradictionsFound();
          } else {
            showCharacter('witness-nervous');
            typeText('裁判長', '証人、この点について説明を求めます。証言を続けなさい。', () => {
              showStatement(state.currentStatement + 1);
            }, '#444488');
          }
        }, '#884422');
      }, 800);
    }, '#2244aa');
  });
}

function wrongPresentation(ev) {
  showShout('異議あり！', '#ff4444', () => {
    showCharacter('attorney');
    typeText('弁護人', `この「${ev.name}」を見てください！ここに矛盾が…`, () => {
      setTimeout(() => {
        showShout('異議あり！', '#4488ff', () => {
          showCharacter('prosecutor');
          typeText('検察官', 'それは的外れな指摘だ。弁護人には証拠の意味を理解する能力がないようだな。', () => {
            shakeScreen();
            // Penalty
            state.penaltyHP -= 20;
            document.getElementById('penalty-fill').style.width = state.penaltyHP + '%';

            if (state.penaltyHP > 60) {
              document.getElementById('penalty-fill').style.background = 'linear-gradient(90deg, #44cc44, #88ee44)';
            } else if (state.penaltyHP > 30) {
              document.getElementById('penalty-fill').style.background = 'linear-gradient(90deg, #ccaa44, #eecc44)';
            } else {
              document.getElementById('penalty-fill').style.background = 'linear-gradient(90deg, #cc4444, #ee6644)';
            }

            showCharacter('judge');
            typeText('裁判長', `弁護人にペナルティを科します。無関係な証拠の提示は慎んでください。`, () => {
              if (state.penaltyHP <= 0) {
                gameOver();
              } else {
                showStatement(state.currentStatement);
              }
            }, '#444488');
          }, '#4444aa');
        });
      }, 500);
    }, '#2244aa');
  });
}

// ============================================================
// End Conditions
// ============================================================
function allContradictionsFound() {
  showCharacter('witness-shocked');
  typeText('佐藤花子', 'うぅ…もう…隠し通せない……', () => {
    shakeScreen();
    setTimeout(() => {
      showCharacter('witness-angry');
      typeText('佐藤花子', '…そうよ！私がやったのよ！あの男は不正を暴こうとした…私の全てを奪おうとしたのよ！だから…だから私は……！', () => {
        setTimeout(() => {
          showCharacter('judge');
          typeText('裁判長', '…証人の自白により、事件の真相が明らかになりました。', () => {
            typeText('裁判長', '被告人・鈴木一郎に対し、<span class="highlight">無罪</span>を言い渡します！', () => {
              setTimeout(() => showResult(true), 1000);
            }, '#444488');
          }, '#444488');
        }, 800);
      }, '#884422');
    }, 500);
  }, '#884422');
}

function endTestimony() {
  if (state.foundContradictions >= TOTAL_CONTRADICTIONS) {
    allContradictionsFound();
  } else {
    showCharacter('judge');
    typeText('裁判長', '証言は以上です。弁護人、もう一度証言を聞きますか？', () => {
      const btns = document.getElementById('action-buttons');
      btns.innerHTML = `
        <button class="btn-next" onclick="restartTestimony()">もう一度聞く</button>
        <button class="btn-press" onclick="openEvidenceList()">証拠品を確認</button>
      `;
    }, '#444488');
  }
}

function restartTestimony() {
  document.getElementById('action-buttons').innerHTML = '';
  showStatement(0);
}

function openEvidenceList() {
  state.selectedEvidence = null;
  const panel = document.getElementById('evidence-panel');
  const list = document.getElementById('evidence-list');

  let html = '';
  for (const ev of EVIDENCE) {
    html += `<div class="evidence-card" id="ev-card-${ev.id}" onclick="selectEvidenceView(${ev.id})">`;
    html += `<span class="evidence-icon">${ev.icon}</span>`;
    html += `<h4>${ev.name}</h4>`;
    html += `<p>${ev.desc}</p>`;
    html += `</div>`;
  }
  list.innerHTML = html;

  document.getElementById('evidence-detail').innerHTML = '<h3>証拠品を選択してください</h3><p>証拠品をクリックすると詳細が表示されます。</p>';
  document.getElementById('btn-submit-evidence').style.display = 'none';
  panel.style.display = 'flex';
}

function selectEvidenceView(id) {
  const ev = EVIDENCE[id];
  document.querySelectorAll('.evidence-card').forEach(c => c.classList.remove('selected'));
  document.getElementById(`ev-card-${id}`).classList.add('selected');
  document.getElementById('evidence-detail').innerHTML =
    `<h3>${ev.icon} ${ev.name}</h3><p>${ev.detail}</p>`;
}

function gameOver() {
  showResult(false);
}

function showResult(victory) {
  const screen = document.getElementById('result-screen');
  const title = document.getElementById('result-title');
  const msg = document.getElementById('result-message');

  screen.className = victory ? 'victory' : 'defeat';

  if (victory) {
    title.textContent = '無罪';
    title.style.color = '#44ff44';
    title.style.textShadow = '0 0 30px rgba(50,255,50,0.6)';
    msg.textContent = `全ての矛盾を暴き、真犯人を追い詰めた！被告人・鈴木一郎は無罪となった。`;
  } else {
    title.textContent = '有罪';
    title.style.color = '#ff4444';
    title.style.textShadow = '0 0 30px rgba(255,50,50,0.6)';
    msg.textContent = `ペナルティが限界に達した…弁護は失敗に終わった。`;
  }

  screen.style.display = 'flex';
}

// ============================================================
// Click to advance text
// ============================================================
document.addEventListener('click', (e) => {
  // Don't advance if clicking buttons or evidence panel
  if (e.target.closest('button') || e.target.closest('#evidence-panel') ||
      e.target.closest('#evidence-actions') || e.target.closest('#title-screen') ||
      e.target.closest('#result-screen')) return;

  if (state.phase === 'title') return;
  skipOrAdvance();
});

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    skipOrAdvance();
  }
  if (e.key === 'Escape') {
    closeEvidence();
  }
});
</script>
</body>
</html>
