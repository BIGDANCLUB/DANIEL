<html lang="ja">

<title>体位クイズ 〜棒人間で当てよう〜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: #f4f6f9;
    color: #222;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  .wrap {
    width: 100%;
    max-width: 560px;
  }
  header {
    text-align: center;
    margin-bottom: 16px;
  }
  header h1 {
    font-size: 1.4rem;
    letter-spacing: 0.04em;
  }
  header p {
    font-size: 0.8rem;
    color: #777;
    margin-top: 4px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    padding: 20px;
  }
  .bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: #555;
    margin-bottom: 12px;
  }
  .bar .score { font-weight: 700; color: #2563eb; }
  .progress {
    height: 6px;
    background: #e5e7eb;
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .progress > div {
    height: 100%;
    background: #2563eb;
    width: 0;
    transition: width 0.3s ease;
  }
  .figure {
    background: #fff;
    border: 1px solid #eef0f3;
    border-radius: 12px;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
  }
  .figure svg { width: 90%; height: 90%; }
  .q-text {
    text-align: center;
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .choice {
    border: 2px solid #e5e7eb;
    background: #fafbfc;
    border-radius: 12px;
    padding: 14px 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
  }
  .choice:hover:not(:disabled) { border-color: #2563eb; background: #eff4ff; }
  .choice:disabled { cursor: default; }
  .choice.correct { border-color: #16a34a; background: #dcfce7; color: #15803d; }
  .choice.wrong { border-color: #dc2626; background: #fee2e2; color: #b91c1c; }
  .explain {
    margin-top: 16px;
    background: #f8fafc;
    border-left: 4px solid #2563eb;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.85rem;
    line-height: 1.6;
    color: #444;
    display: none;
  }
  .explain.show { display: block; }
  .explain b { color: #2563eb; }
  .next-btn, .restart-btn {
    margin-top: 16px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    display: none;
  }
  .next-btn.show, .restart-btn { display: block; }
  .next-btn:hover, .restart-btn:hover { background: #1d4ed8; }
  .result {
    text-align: center;
  }
  .result .big {
    font-size: 2.4rem;
    font-weight: 800;
    color: #2563eb;
    margin: 8px 0;
  }
  .result .msg { color: #555; margin-bottom: 8px; font-size: 0.95rem; }
  footer {
    text-align: center;
    font-size: 0.7rem;
    color: #aaa;
    margin-top: 16px;
    line-height: 1.5;
  }
</style>
</head>

      <line x1="135" y1="92" x2="118" y2="100" stroke="#111" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="135" y1="92" x2="152" y2="104" stroke="#111" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="126" y1="120" x2="114" y2="150" stroke="#111" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="126" y1="120" x2="142" y2="150" stroke="#111" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    `
  },
];

/* ============================ クイズ進行 ============================ */
const TOTAL = POSITIONS.length;
let order = [];
let current = 0;
let score = 0;
let answered = false;

const card = document.getElementById("card");

// 配列シャッフル
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function start(){
  order = shuffle(POSITIONS.map((_,i)=>i));
  current = 0;
  score = 0;
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  const pos = POSITIONS[order[current]];

  // 選択肢：正解＋他3つ（重複なし）
  const others = shuffle(POSITIONS.filter(p=>p.name!==pos.name)).slice(0,3);
  const choices = shuffle([pos, ...others]);

  const progressPct = (current/TOTAL)*100;

  card.innerHTML = `
    <div class="bar">
      <span>第 ${current+1} / ${TOTAL} 問</span>
      <span class="score">スコア ${score}</span>
    </div>
    <div class="progress"><div style="width:${progressPct}%"></div></div>
    <div class="figure"><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">${pos.svg}</svg></div>
    <div class="q-text">このイラストの体位は？</div>
    <div class="choices">
      ${choices.map(c=>`<button class="choice" data-name="${c.name}">${c.name}</button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <button class="next-btn" id="nextBtn">次の問題へ ▶</button>
  `;

  card.querySelectorAll(".choice").forEach(btn=>{
    btn.addEventListener("click", ()=>onAnswer(btn, pos));
  });
  document.getElementById("nextBtn").addEventListener("click", next);
}

function onAnswer(btn, pos){
  if(answered) return;
  answered = true;
  const chosen = btn.dataset.name;
  const correct = chosen === pos.name;
  if(correct) score++;

  card.querySelectorAll(".choice").forEach(b=>{
    b.disabled = true;
    if(b.dataset.name === pos.name) b.classList.add("correct");
    else if(b===btn) b.classList.add("wrong");
  });

  const ex = document.getElementById("explain");
  ex.innerHTML = `${correct?"⭕ 正解！":"❌ 不正解"} 　正解は <b>${pos.name}</b>（${pos.aka}）<br>${pos.desc}`;
  ex.classList.add("show");
  document.getElementById("nextBtn").classList.add("show");
}

function next(){
  current++;
  if(current >= TOTAL) renderResult();
  else renderQuestion();
}

function renderResult(){
  let msg;
  const rate = score/TOTAL;
  if(rate===1) msg = "全問正解！博識ですね 🎓";
  else if(rate>=0.7) msg = "なかなかの正解率です 👏";
  else if(rate>=0.4) msg = "もう一度挑戦してみましょう 💪";
  else msg = "これから覚えていきましょう 📖";

  card.innerHTML = `
    <div class="result">
      <div>結果発表</div>
      <div class="big">${score} / ${TOTAL}</div>
      <div class="msg">${msg}</div>
      <button class="restart-btn" id="restart">もう一度挑戦する 🔄</button>
    </div>
  `;
  document.getElementById("restart").addEventListener("click", start);
}

// 全問数をヘッダーに反映
document.getElementById("subtitle").textContent =
  `棒人間のイラストから、正しい体位の名前を当てよう（全${TOTAL}問）`;
start();
</script>
</body>
</html>
